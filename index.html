<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Studio - Chat, Images & Videos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#131314',
                            sidebar: '#1e1f20',
                            card: '#282a2c',
                            input: '#1f1f21',
                            border: '#333537'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-dark-bg text-gray-100 h-screen flex overflow-hidden font-sans">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-dark-sidebar w-64 flex flex-col justify-between transition-all duration-300 z-20 border-r border-dark-border md:translate-x-0 -translate-x-full fixed md:static h-full">
        <div class="p-4 flex flex-col h-full">
            <!-- New Chat Button -->
            <button onclick="createNewChat()" class="flex items-center gap-3 bg-dark-card hover:bg-dark-border border border-dark-border px-4 py-3 rounded-full text-sm font-medium transition mb-4 shadow-sm">
                <i class="fa-solid fa-plus text-blue-400"></i>
                <span>New Studio Chat</span>
            </button>

            <!-- Mode Selection -->
            <div class="text-xs font-semibold text-gray-400 px-2 mb-2 uppercase tracking-wider">Creation Mode</div>
            <div class="space-y-1 mb-6">
                <button onclick="setMode('chat')" id="btnModeChat" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm bg-blue-600 text-white font-medium">
                    <i class="fa-solid fa-comments"></i> Chat (OpenRouter)
                </button>
                <button onclick="setMode('image')" id="btnModeImage" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:bg-dark-card hover:text-white transition">
                    <i class="fa-solid fa-image text-purple-400"></i> HD Image Generator
                </button>
                <button onclick="setMode('video')" id="btnModeVideo" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm text-gray-400 hover:bg-dark-card hover:text-white transition">
                    <i class="fa-solid fa-video text-pink-400"></i> 10s Video Generator
                </button>
            </div>

            <!-- Recent Chats Header -->
            <div class="text-xs font-semibold text-gray-400 px-2 mb-2 uppercase tracking-wider">History</div>

            <!-- Chat History List -->
            <div id="chatHistoryList" class="flex-1 overflow-y-auto space-y-1 pr-1 custom-scrollbar">
                <!-- Dynamically populated -->
            </div>

            <!-- Bottom Settings Trigger -->
            <div class="pt-4 border-t border-dark-border">
                <button onclick="openSettings()" class="flex items-center gap-3 w-full px-3 py-2.5 rounded-lg hover:bg-dark-card text-sm text-gray-300 transition">
                    <i class="fa-solid fa-gear text-gray-400"></i>
                    <span>Settings & API Key</span>
                </button>
            </div>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full relative bg-dark-bg">
        <!-- Top Navbar -->
        <header class="h-14 border-b border-dark-border flex items-center justify-between px-4 bg-dark-bg/80 backdrop-blur z-10">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="text-gray-400 hover:text-white md:hidden p-2">
                    <i class="fa-solid fa-bars text-lg"></i>
                </button>
                <span id="currentModeDisplay" class="text-xs font-medium text-gray-300 bg-dark-card px-3 py-1 rounded-full border border-dark-border flex items-center gap-2">
                    <span id="modeBadge" class="w-2 h-2 rounded-full bg-blue-500"></span>
                    Mode: <span id="modeNameLabel" class="text-blue-400 font-semibold">Text Chat</span>
                </span>
            </div>
            <div>
                <button onclick="openSettings()" class="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-dark-card transition" title="Settings">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- Container -->
        <div id="chatContainer" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6 max-w-4xl w-full mx-auto pb-36">
            <!-- Welcome Screen -->
            <div id="welcomeScreen" class="h-full flex flex-col items-center justify-center text-center space-y-4">
                <div class="w-14 h-14 rounded-full bg-gradient-to-r from-blue-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg animate-pulse">
                    <i class="fa-solid fa-wand-magic-sparkles text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">AI Media & Chat Studio</h1>
                <p class="text-gray-400 text-sm max-w-md">Chat with models, create high-quality HD images, or render 10-second AI videos for free!</p>
            </div>
        </div>

        <!-- Input Box Area -->
        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-dark-bg via-dark-bg to-transparent pt-6 pb-4 px-4">
            <div class="max-w-4xl mx-auto">
                <form id="chatForm" onsubmit="handleSendMessage(event)" class="relative bg-dark-input border border-dark-border rounded-2xl shadow-lg focus-within:border-blue-500 transition">
                    <textarea id="userInput" rows="1" placeholder="Type prompt or question..." class="w-full bg-transparent text-gray-100 placeholder-gray-500 px-4 py-3.5 pr-12 rounded-2xl focus:outline-none resize-none max-h-32 text-sm" onkeydown="handleKeyDown(event)"></textarea>
                    <button type="submit" id="sendBtn" class="absolute right-2.5 bottom-2.5 bg-blue-600 hover:bg-blue-500 text-white w-9 h-9 rounded-xl flex items-center justify-center transition shadow">
                        <i class="fa-solid fa-paper-plane text-xs"></i>
                    </button>
                </form>
                <div class="text-center mt-2 text-[11px] text-gray-500">
                    Free HD Images & 10s AI Videos integration ready. Set OpenRouter API Key for Text Chat.
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-dark-sidebar border border-dark-border w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b border-dark-border pb-3">
                <h3 class="text-lg font-semibold text-gray-200"><i class="fa-solid fa-gear mr-2 text-blue-400"></i>Studio Settings</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">OpenRouter API Key</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." class="w-full bg-dark-input border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-400 uppercase tracking-wider mb-1">Custom OpenRouter Model</label>
                    <input type="text" id="modelInput" placeholder="google/gemini-flash-1.5" class="w-full bg-dark-input border border-dark-border rounded-xl px-3.5 py-2.5 text-sm text-gray-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>
            <div class="flex justify-end gap-3 pt-3 border-t border-dark-border">
                <button onclick="closeSettings()" class="px-4 py-2 rounded-xl text-sm font-medium bg-dark-card hover:bg-dark-border text-gray-300 transition">Cancel</button>
                <button onclick="saveSettings()" class="px-4 py-2 rounded-xl text-sm font-medium bg-blue-600 hover:bg-blue-500 text-white transition shadow">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Main Logic Script -->
    <script>
        let chats = JSON.parse(localStorage.getItem('ai_studio_chats')) || [];
        let currentChatId = localStorage.getItem('current_studio_chat_id') || null;
        let apiKey = localStorage.getItem('openrouter_api_key') || '';
        let customModel = localStorage.getItem('openrouter_model') || 'google/gemini-flash-1.5';
        let currentMode = 'chat'; // 'chat', 'image', 'video'

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('apiKeyInput').value = apiKey;
            document.getElementById('modelInput').value = customModel;
            
            renderChatList();
            if (currentChatId && chats.some(c => c.id === currentChatId)) {
                loadChat(currentChatId);
            } else {
                createNewChat();
            }
        });

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('-translate-x-full');
        }

        function setMode(mode) {
            currentMode = mode;
            const btnChat = document.getElementById('btnModeChat');
            const btnImg = document.getElementById('btnModeImage');
            const btnVid = document.getElementById('btnModeVideo');
            const label = document.getElementById('modeNameLabel');
            const badge = document.getElementById('modeBadge');

            btnChat.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition " + (mode === 'chat' ? 'bg-blue-600 text-white font-medium' : 'text-gray-400 hover:bg-dark-card hover:text-white');
            btnImg.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition " + (mode === 'image' ? 'bg-purple-600 text-white font-medium' : 'text-gray-400 hover:bg-dark-card hover:text-white');
            btnVid.className = "w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm transition " + (mode === 'video' ? 'bg-pink-600 text-white font-medium' : 'text-gray-400 hover:bg-dark-card hover:text-white');

            if(mode === 'chat') {
                label.innerText = 'Text Chat';
                label.className = 'text-blue-400 font-semibold';
                badge.className = 'w-2 h-2 rounded-full bg-blue-500';
            } else if(mode === 'image') {
                label.innerText = 'HD Image Generator';
                label.className = 'text-purple-400 font-semibold';
                badge.className = 'w-2 h-2 rounded-full bg-purple-500';
            } else if(mode === 'video') {
                label.innerText = '10s Video Generator';
                label.className = 'text-pink-400 font-semibold';
                badge.className = 'w-2 h-2 rounded-full bg-pink-500';
            }
        }

        function openSettings() {
            document.getElementById('settingsModal').classList.remove('hidden');
            document.getElementById('settingsModal').classList.add('flex');
        }

        function closeSettings() {
            document.getElementById('settingsModal').classList.add('hidden');
            document.getElementById('settingsModal').classList.remove('flex');
        }

        function saveSettings() {
            apiKey = document.getElementById('apiKeyInput').value.trim();
            customModel = document.getElementById('modelInput').value.trim() || 'google/gemini-flash-1.5';
            localStorage.setItem('openrouter_api_key', apiKey);
            localStorage.setItem('openrouter_model', customModel);
            closeSettings();
        }

        function createNewChat() {
            const newChat = {
                id: 'chat_' + Date.now(),
                title: 'New Conversation',
                messages: []
            };
            chats.unshift(newChat);
            currentChatId = newChat.id;
            saveAndRender();
            loadChat(currentChatId);
        }

        function saveAndRender() {
            localStorage.setItem('ai_studio_chats', JSON.stringify(chats));
            localStorage.setItem('current_studio_chat_id', currentChatId);
            renderChatList();
        }

        function renderChatList() {
            const listEl = document.getElementById('chatHistoryList');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const isActive = chat.id === currentChatId;
                const div = document.createElement('div');
                div.className = `group flex items-center justify-between px-3 py-2.5 rounded-lg text-sm cursor-pointer transition ${isActive ? 'bg-dark-card text-white font-medium' : 'text-gray-400 hover:bg-dark-card/50 hover:text-gray-200'}`;
                div.onclick = () => loadChat(chat.id);
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <i class="fa-regular fa-message text-xs opacity-70"></i>
                        <span class="truncate">${escapeHtml(chat.title)}</span>
                    </div>
                    <button onclick="deleteChat(event, '${chat.id}')" class="opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-400 p-1 transition">
                        <i class="fa-solid fa-trash-can text-xs"></i>
                    </button>
                `;
                listEl.appendChild(div);
            });
        }

        function loadChat(id) {
            currentChatId = id;
            localStorage.setItem('current_studio_chat_id', currentChatId);
            renderChatList();
            displayMessages();
        }

        function deleteChat(e, id) {
            e.stopPropagation();
            chats = chats.filter(c => c.id !== id);
            if (chats.length === 0) {
                createNewChat();
            } else if (currentChatId === id) {
                loadChat(chats[0].id);
            } else {
                saveAndRender();
            }
        }

        function displayMessages() {
            const container = document.getElementById('chatContainer');
            const welcomeScreen = document.getElementById('welcomeScreen');
            const chat = chats.find(c => c.id === currentChatId);

            if (!chat || chat.messages.length === 0) {
                welcomeScreen.style.display = 'flex';
                container.innerHTML = '';
                container.appendChild(welcomeScreen);
                return;
            }

            welcomeScreen.style.display = 'none';
            container.innerHTML = '';

            chat.messages.forEach(msg => {
                const isUser = msg.role === 'user';
                const messageDiv = document.createElement('div');
                messageDiv.className = `flex gap-4 max-w-3xl mx-auto w-full ${isUser ? 'justify-end' : 'justify-start'}`;
                
                if (!isUser) {
                    let contentHtml = '';
                    if (msg.type === 'image') {
                        contentHtml = `<div class="space-y-2">
                            <img src="${msg.content}" class="rounded-xl max-w-full h-auto border border-dark-border shadow-md" alt="AI Generated Image" />
                            <a href="${msg.content}" target="_blank" class="inline-block text-xs text-purple-400 hover:underline"><i class="fa-solid fa-download mr-1"></i>Open Full HD Image</a>
                        </div>`;
                    } else if (msg.type === 'video') {
                        contentHtml = `<div class="space-y-2">
                            <video controls class="rounded-xl max-w-full w-full border border-dark-border shadow-md" autoplay loop muted>
                                <source src="${msg.content}" type="video/mp4">
                                Your browser does not support video playback.
                            </video>
                            <a href="${msg.content}" target="_blank" class="inline-block text-xs text-pink-400 hover:underline"><i class="fa-solid fa-download mr-1"></i>Download 10s Video</a>
                        </div>`;
                    } else {
                        contentHtml = formatMarkdown(msg.content);
                    }

                    messageDiv.innerHTML = `
                        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shrink-0 shadow">
                            <i class="fa-solid fa-robot text-white text-xs"></i>
                        </div>
                        <div class="bg-dark-card border border-dark-border rounded-2xl px-4 py-3 text-sm text-gray-200 leading-relaxed shadow-sm w-full">
                            ${contentHtml}
                        </div>
                    `;
                } else {
                    messageDiv.innerHTML = `
                        <div class="bg-blue-600/20 border border-blue-500/30 rounded-2xl px-4 py-3 text-sm text-gray-100 leading-relaxed max-w-xl shadow-sm">
                            <span class="text-xs text-blue-400 font-semibold block mb-1 uppercase">[${msg.mode || 'Chat'}]</span>
                            ${escapeHtml(msg.content)}
                        </div>
                    `;
                }
                container.appendChild(messageDiv);
            });
            container.scrollTop = container.scrollHeight;
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                document.getElementById('chatForm').requestSubmit();
            }
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const inputEl = document.getElementById('userInput');
            const text = inputEl.value.trim();
            if (!text) return;

            if (currentMode === 'chat' && !apiKey) {
                alert('Text Chat ke liye OpenRouter API Key add karein Settings mein!');
                openSettings();
                return;
            }

            inputEl.value = '';
            inputEl.style.height = 'auto';

            let chat = chats.find(c => c.id === currentChatId);
            if (!chat) {
                createNewChat();
                chat = chats.find(c => c.id === currentChatId);
            }

            if (chat.messages.length === 0) {
                chat.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
            }

            chat.messages.push({ role: 'user', content: text, mode: currentMode });
            saveAndRender();
            displayMessages();

            // Placeholder for AI Response
            const container = document.getElementById('chatContainer');
            const assistantMsgId = 'msg_' + Date.now();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-4 max-w-3xl mx-auto w-full justify-start';
            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center shrink-0 shadow animate-pulse">
                    <i class="fa-solid fa-spinner fa-spin text-white text-xs"></i>
                </div>
                <div id="${assistantMsgId}" class="bg-dark-card border border-dark-border rounded-2xl px-4 py-3 text-sm text-gray-300 leading-relaxed shadow-sm w-full">
                    Generating ${currentMode}... Please wait.
                </div>
            `;
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;

            try {
                if (currentMode === 'image') {
                    // Free High Quality Image via Pollinations
                    const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1024&nologo=true&seed=${Math.floor(Math.random()*100000)}`;
                    
                    chat.messages.push({ role: 'assistant', content: imageUrl, type: 'image' });
                    saveAndRender();
                    displayMessages();

                } else if (currentMode === 'video') {
                    // Free AI Video Generation via Video Engine Stream/Pollinations Video
                    const videoUrl = `https://video.pollinations.ai/prompt/${encodeURIComponent(text)}?duration=10&seed=${Math.floor(Math.random()*100000)}`;
                    
                    chat.messages.push({ role: 'assistant', content: videoUrl, type: 'video' });
                    saveAndRender();
                    displayMessages();

                } else {
                    // OpenRouter Chat Logic
                    const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                        method: "POST",
                        headers: {
                            "Authorization": `Bearer ${apiKey}`,
                            "Content-Type": "application/json",
                            "HTTP-Referer": window.location.href,
                            "X-Title": "Universal AI Studio"
                        },
                        body: JSON.stringify({
                            model: customModel,
                            messages: chat.messages.filter(m => m.type !== 'image' && m.type !== 'video').map(m => ({ role: m.role, content: m.content }))
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message || "API Error");

                    const reply = data.choices[0].message.content;
                    chat.messages.push({ role: 'assistant', content: reply, type: 'text' });
                    saveAndRender();
                    displayMessages();
                }

            } catch (error) {
                document.getElementById(assistantMsgId).innerHTML = `<span class="text-red-400">Error: ${escapeHtml(error.message)}</span>`;
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function formatMarkdown(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
